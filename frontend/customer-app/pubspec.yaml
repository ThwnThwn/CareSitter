name: caresitter_customer
description: CareSitter - Ứng dụng chăm sóc người cao tuổi tại nhà
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.3

  # HTTP
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Storage
  flutter_secure_storage: ^10.3.1
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3

  # Realtime
  signalr_netcore: ^1.3.6

  # Firebase
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

  # Google Identity (ID token is verified by the CareSitter backend)
  google_sign_in: ^7.2.0
  web: ^1.1.1

  # Map & Location
  google_maps_flutter: ^2.18.1
  pointer_interceptor: ^0.10.1+3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

  # Camera
  camera: ^0.12.0+1
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # UI / Design
  # google_fonts: gỡ bỏ — Inter đã được bundle vào assets/fonts (xem mục flutter.fonts)
  # tránh tải font qua mạng lúc khởi động (font flash + phụ thuộc network)
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.3
  smooth_page_indicator: ^1.2.0+3
  pin_code_fields: ^8.0.1
  fl_chart: ^0.69.0
  badges: ^3.1.2
  flutter_rating_bar: ^4.0.1

  # Forms
  reactive_forms: ^17.0.1
  intl: ^0.20.2

  # Utils
  connectivity_plus: ^6.1.1
  url_launcher: ^6.3.1
  share_plus: ^13.2.0
  permission_handler: ^11.3.1
  package_info_plus: ^10.2.0
  equatable: ^2.0.7
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  timeago: ^3.7.0
  collection: ^1.19.1
  app_links: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  google_maps_flutter_platform_interface: ^2.17.0
  build_runner: ^2.4.14
  riverpod_generator: any
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/animations/
    - assets/icons/
    - assets/images/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/NunitoVariable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
