# Optional messaging stack: compose.yml + compose.kafka.yml.
# One broker and RF=1 are suitable for an assignment demo, not disk-loss tolerance.
services:
  kafka-storage-init:
    image: apache/kafka:3.9.1
    user: "0:0"
    restart: "no"
    # A new named volume belongs to root; the broker runs as appuser (UID 1000).
    entrypoint: [/bin/sh, -c, "chown 1000:1000 /tmp/kraft-combined-logs"]
    volumes: [kafkadata:/tmp/kraft-combined-logs]
    networks: [data]

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    depends_on:
      kafka-storage-init: {condition: service_completed_successfully}
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: [kafkadata:/tmp/kraft-combined-logs]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-init:
    image: apache/kafka:3.9.1
    restart: "no"
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_NOTIFICATIONS: ${KAFKA_TOPIC_NOTIFICATIONS:-caresitter.notifications.events.v1}
      KAFKA_TOPIC_PAYMENTS: ${KAFKA_TOPIC_PAYMENTS:-caresitter.payments.events.v1}
      KAFKA_TOPIC_NUTRITION: ${KAFKA_TOPIC_NUTRITION:-caresitter.nutrition.events.v1}
      KAFKA_TOPIC_NOTIFICATIONS_DLQ: ${KAFKA_TOPIC_NOTIFICATIONS_DLQ:-}
      KAFKA_TOPIC_PAYMENTS_DLQ: ${KAFKA_TOPIC_PAYMENTS_DLQ:-}
      KAFKA_TOPIC_NUTRITION_DLQ: ${KAFKA_TOPIC_NUTRITION_DLQ:-}
    volumes: [./kafka-init.sh:/init/kafka-init.sh:ro]
    entrypoint: [/bin/bash, /init/kafka-init.sh]
    networks: [data]

  api:
    environment:
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_FLOW_NOTIFICATIONS_ENABLED: ${KAFKA_FLOW_NOTIFICATIONS_ENABLED:-true}
      KAFKA_FLOW_PAYMENTS_ENABLED: ${KAFKA_FLOW_PAYMENTS_ENABLED:-false}
      KAFKA_INTERNAL_SERVICE_KEY: ${KAFKA_INTERNAL_SERVICE_KEY:?Set a random messaging service key in deploy/.env}
    depends_on:
      kafka-init: {condition: service_completed_successfully}

  notification-worker:
    build:
      context: ../backend
      dockerfile: NotificationWorker.Dockerfile
    restart: unless-stopped
    env_file: ${CARESITTER_ENV_FILE:-.env}
    environment:
      KAFKA_ENABLED: "true"
      KAFKA_FLOW_NOTIFICATIONS_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CLIENT_ID: caresitter-notification-worker
      KAFKA_SUPPORT_API_URL: http://api:8080/
      KAFKA_INTERNAL_SERVICE_KEY: ${KAFKA_INTERNAL_SERVICE_KEY:?Set a random messaging service key in deploy/.env}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    volumes: [./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro]
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      api: {condition: service_started}
    # The worker needs outbound Internet access for FCM and SMTP; no ports are published.
    networks: [edge, data]

volumes:
  kafkadata:
