# Postgres + PostGIS + Redis + RedisInsight cho dev local. Doc bien tu file .env.
# Chay:  docker compose up -d
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: caresitter-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caresitter}
      POSTGRES_USER: ${POSTGRES_USER:-caresitter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caresitter}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - caresitter-pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caresitter} -d ${POSTGRES_DB:-caresitter}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: caresitter-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-caresitter}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-caresitter}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redisinsight:
    image: redis/redisinsight:latest
    container_name: caresitter-redisinsight
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${REDISINSIGHT_PORT:-5540}:5540"
    environment:
      RI_APP_HOST: "0.0.0.0"
      RI_APP_PORT: "5540"
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: "CareSitter Local"
      RI_REDIS_USERNAME: default
      RI_REDIS_PASSWORD: ${REDIS_PASSWORD:-caresitter}
      RI_REDIS_DB: "0"
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
    volumes:
      - caresitter-redisinsight-data:/data

volumes:
  caresitter-pgdata:
  caresitter-redisinsight-data:
