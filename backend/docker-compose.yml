# PostgreSQL, Redis and Kafka for local development. Settings come from .env.
# Chay:  docker compose up -d
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: caresitter-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caresitter}
      POSTGRES_USER: ${POSTGRES_USER:-caresitter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caresitter}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - caresitter-pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caresitter} -d ${POSTGRES_DB:-caresitter}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: caresitter-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-caresitter}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-caresitter}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redisinsight:
    image: redis/redisinsight:latest
    container_name: caresitter-redisinsight
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${REDISINSIGHT_PORT:-5540}:5540"
    environment:
      RI_APP_HOST: "0.0.0.0"
      RI_APP_PORT: "5540"
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: "CareSitter Local"
      RI_REDIS_USERNAME: default
      RI_REDIS_PASSWORD: ${REDIS_PASSWORD:-caresitter}
      RI_REDIS_DB: "0"
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
    volumes:
      - caresitter-redisinsight-data:/data

  kafka-storage-init:
    image: apache/kafka:3.9.1
    container_name: caresitter-kafka-storage-init
    user: "0:0"
    restart: "no"
    # The Kafka image runs as UID 1000; a new named volume belongs to root.
    entrypoint: [/bin/sh, -c, "chown 1000:1000 /tmp/kraft-combined-logs"]
    volumes:
      - caresitter-kafkadata:/tmp/kraft-combined-logs

  kafka:
    image: apache/kafka:3.9.1
    container_name: caresitter-kafka
    restart: unless-stopped
    depends_on:
      kafka-storage-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      # Host processes use localhost; containers use the Compose service name.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - caresitter-kafkadata:/tmp/kraft-combined-logs
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: caresitter-kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_NOTIFICATIONS: ${KAFKA_TOPIC_NOTIFICATIONS:-caresitter.notifications.events.v1}
      KAFKA_TOPIC_PAYMENTS: ${KAFKA_TOPIC_PAYMENTS:-caresitter.payments.events.v1}
      KAFKA_TOPIC_NUTRITION: ${KAFKA_TOPIC_NUTRITION:-caresitter.nutrition.events.v1}
      KAFKA_TOPIC_NOTIFICATIONS_DLQ: ${KAFKA_TOPIC_NOTIFICATIONS_DLQ:-}
      KAFKA_TOPIC_PAYMENTS_DLQ: ${KAFKA_TOPIC_PAYMENTS_DLQ:-}
      KAFKA_TOPIC_NUTRITION_DLQ: ${KAFKA_TOPIC_NUTRITION_DLQ:-}
    volumes:
      - ../deploy/kafka-init.sh:/init/kafka-init.sh:ro
    entrypoint: [/bin/bash, /init/kafka-init.sh]

  # Public HTTPS tunnel cho VNPay Sandbox gọi IPN vào backend local.
  ngrok:
    image: ngrok/ngrok:latest
    container_name: caresitter-ngrok
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: ["http", "--log=stdout", "host.docker.internal:5033"]
    ports:
      - "4040:4040"
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  caresitter-pgdata:
  caresitter-redisinsight-data:
  caresitter-kafkadata:
