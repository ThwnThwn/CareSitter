[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "caresitter-nutrition-knowledge-g0"
version = "0.1.0"
description = "Offline G0 benchmark gate for the CareSitter Nutrition knowledge pipeline"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
nutrition-knowledge-g0 = "nutrition_knowledge_g0.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
