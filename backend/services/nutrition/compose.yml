services:
  nutrition-db:
    image: postgres:16
    environment:
      POSTGRES_DB: nutrition
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${NUTRITION_DB_ADMIN_PASSWORD:?Set administrative DB password}
      NUTRITION_DB_APP_PASSWORD: ${NUTRITION_DB_APP_PASSWORD:?Set runtime DB password}
    volumes:
      - nutrition-data:/var/lib/postgresql/data
      - ../../init-db/nutrition-service/01-nutrition-workflow.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../../init-db/nutrition-service/02-runtime-role.sql:/runtime-role.sql:ro
      - ./scripts/02-runtime-role.sh:/docker-entrypoint-initdb.d/02-runtime-role.sh:ro
      - ../../init-db/nutrition-service/03-catalog-governance.sql:/docker-entrypoint-initdb.d/03-catalog-governance.sql:ro
      - ../../init-db/nutrition-service/04-catalog-nutrient-constraints.sql:/docker-entrypoint-initdb.d/04-catalog-nutrient-constraints.sql:ro
      - ../../init-db/nutrition-service/05-recipe-source-citations.sql:/docker-entrypoint-initdb.d/05-recipe-source-citations.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d nutrition"]
      interval: 5s
      timeout: 3s
      retries: 10
  nutrition:
    build: .
    ports: ["127.0.0.1:5035:8080", "127.0.0.1:5036:8081"]
    depends_on:
      nutrition-db: {condition: service_healthy}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
      Kestrel__Endpoints__Http__Protocols: Http1
      Kestrel__Endpoints__Grpc__Url: http://0.0.0.0:8081
      Kestrel__Endpoints__Grpc__Protocols: Http2
      Gateway__ServiceKey: ${NUTRITION_GATEWAY_SERVICE_KEY:?Set gateway credential}
      ConnectionStrings__Nutrition: Host=nutrition-db;Database=nutrition;Username=nutrition_app;Password=${NUTRITION_DB_APP_PASSWORD:?Set runtime DB password}
      Jwt__SecretKey: ${NUTRITION_JWT_SECRET:?Use JWT validation key of Identity}
      Jwt__Issuer: ${NUTRITION_JWT_ISSUER:?Set issuer}
      Jwt__Audience: ${NUTRITION_JWT_AUDIENCE:?Set audience}
      People__BaseUrl: ${NUTRITION_PEOPLE_URL:-http://host.docker.internal:5033/}
      People__ServiceKey: ${NUTRITION_INTERNAL_SERVICE_KEY:?Set internal credential}
      Nutrition__Enabled: ${NUTRITION_ENABLED:-false}
      Nutrition__AssessmentsEnabled: ${NUTRITION_ASSESSMENTS_ENABLED:-false}
      Nutrition__RecommendationsEnabled: ${NUTRITION_RECOMMENDATIONS_ENABLED:-false}
      HealthParser__Enabled: ${NUTRITION_HEALTH_PARSER_ENABLED:-false}
      HealthParser__Provider: ${NUTRITION_HEALTH_PARSER_PROVIDER:-OpenAI}
      HealthParser__Model: ${NUTRITION_HEALTH_PARSER_MODEL:-gpt-6-luna}
      HealthParser__BaseUrl: ${NUTRITION_HEALTH_PARSER_BASE_URL:-https://api.openai.com/v1/}
      HealthParser__ApiKey: ${NUTRITION_HEALTH_PARSER_API_KEY:-}
      HealthParser__DataProcessingApproved: ${NUTRITION_HEALTH_PARSER_DATA_PROCESSING_APPROVED:-false}
      HealthParser__TimeoutSeconds: ${NUTRITION_HEALTH_PARSER_TIMEOUT_SECONDS:-25}
      HealthParser__MaxOutputTokens: ${NUTRITION_HEALTH_PARSER_MAX_OUTPUT_TOKENS:-2048}
      HealthParser__MaxAttempts: ${NUTRITION_HEALTH_PARSER_MAX_ATTEMPTS:-2}
      HealthParser__MaxConcurrency: ${NUTRITION_HEALTH_PARSER_MAX_CONCURRENCY:-4}
      HealthParser__DailyBudget: ${NUTRITION_HEALTH_PARSER_DAILY_BUDGET:-1000}
      HealthParser__MaxInputCharacters: ${NUTRITION_HEALTH_PARSER_MAX_INPUT_CHARACTERS:-12000}
      HealthParser__MaxResponseBytes: ${NUTRITION_HEALTH_PARSER_MAX_RESPONSE_BYTES:-262144}
      Cors__AllowedOrigins__0: ${NUTRITION_CUSTOMER_ORIGIN:-http://localhost:3000}
volumes:
  nutrition-data:
