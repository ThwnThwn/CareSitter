<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780"><rect width="360" height="780" rx="28" fill="#FFF8EE"/><rect x="16" y="16" width="328" height="748" rx="24" fill="#fff"/><text x="32" y="60" font-family="Arial" font-size="14" fill="#806744">← Cập nhật hồ sơ</text><circle cx="180" cy="148" r="42" fill="#FFF0C9"/><text x="180" y="160" text-anchor="middle" font-family="Arial" font-size="32" fill="#B47722">!</text><text x="180" y="232" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#4A3922">Cần bổ sung thông tin</text><text x="180" y="262" text-anchor="middle" font-family="Arial" font-size="14" fill="#806744">Để gợi ý món ăn an toàn hơn</text><text x="32" y="330" font-family="Arial" font-size="14" font-weight="700" fill="#4A3922">Vui lòng trả lời thêm:</text><rect x="32" y="348" width="296" height="64" rx="16" fill="#FFF7E8"/><text x="48" y="375" font-family="Arial" font-size="14" fill="#4A3922">Khả năng nhai / nuốt</text><text x="48" y="397" font-family="Arial" font-size="12" fill="#9A7D53">Bình thường · Cần mềm · Cần xay</text><rect x="32" y="428" width="296" height="64" rx="16" fill="#FFF7E8"/><text x="48" y="455" font-family="Arial" font-size="14" fill="#4A3922">Mức nêm nếm</text><text x="48" y="477" font-family="Arial" font-size="12" fill="#9A7D53">Nhạt · Vừa · Đậm</text><rect x="32" y="530" width="296" height="58" rx="16" fill="#D99033"/><text x="180" y="566" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">Bổ sung ngay</text><text x="180" y="632" text-anchor="middle" font-family="Arial" font-size="14" fill="#806744">Để sau, quay lại hồ sơ</text><text x="32" y="710" font-family="Arial" font-size="12" fill="#9A7D53">C-NUT-04 · missing-information recovery</text></svg>
